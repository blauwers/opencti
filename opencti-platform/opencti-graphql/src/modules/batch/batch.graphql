enum BatchAdmissionStatus {
  ACCEPTED
}

enum BatchExecutionMode {
  ATOMIC
  BULK
  COMPATIBILITY
  LEGACY_SPLIT
}

enum BatchExecutionPreference {
  AUTO
  ATOMIC
  BULK
  COMPATIBILITY
  LEGACY_SPLIT
}

enum BatchExecutionReason {
  EXPLICIT_COMPATIBILITY
  EXPLICIT_LEGACY_SPLIT
  IDENTITY_INDICATOR_ATOMIC_COHORT
  GENERIC_BULK_COMPATIBLE
  OPERATIONAL_BUNDLE_COMPATIBILITY
}

enum BatchWaitUntil {
  COMMITTED
  MATERIALIZED
}

enum BatchDeliveryBranchKind {
  ROOT
  LEGACY_SPLIT
  OVERSIZED_CHUNK
  INTACT_REPLAY
  TERMINAL_DEAD_LETTER
}

enum BatchDeliveryKind {
  ROOT
  CHILD
}

enum BatchDeliveryState {
  READY
  PUBLISHED
}

enum BatchDeliveryHandoffEvidence {
  NONE
  PLANNED
  CHILDREN_RESERVED
  CHILDREN_PUBLISHED
}

enum BatchExecutionReceiptState {
  PREPARED
  STARTED
  COMPLETED
  FAILED_TERMINAL
  REQUIRES_RECONCILIATION
}

enum BatchExecutionReceiptCompletionBoundary {
  MATERIALIZED
}

enum BatchExecutionReceiptFailureProof {
  PRE_START_VALIDATION
  NO_EFFECT_TERMINAL
}

enum BatchExecutionReconciliationState {
  OPEN
  RUNNING_OBSERVED
  MATERIALIZATION_PENDING
  AMBIGUOUS
  RESOLVED_COMPLETED
  RESOLVED_FAILED_TERMINAL
}

enum BatchExecutionReconciliationOpenedReason {
  COMMITTED_WITHOUT_DURABLE_MATERIALIZATION
  POST_START_ERROR
  EXPLICIT_STARTED_RECEIPT
  EXPLICIT_REQUIRES_RECONCILIATION_RECEIPT
}

enum BatchExecutionReconciliationEvidenceClass {
  EXISTING_TERMINAL_RECEIPT
  MATERIALIZATION_TERMINAL
  NO_EFFECT_TERMINAL
  ACTIVE_ATTEMPT
  MATERIALIZATION_HANDOFF
}

enum BatchExecutionReconciliationEvidenceRefType {
  BATCH_EXECUTION_RECEIPT
  BATCH_MATERIALIZATION_HANDOFF
  BACKEND_ATTEMPT_OBSERVATION
}

input BatchSubmitOptionsInput {
  wait_until: BatchWaitUntil
  execution_preference: BatchExecutionPreference
  idempotency_key: String
  split_bundles: Boolean
  cleanup_inconsistent_bundle: Boolean
}

input BatchGraphqlOperationInput {
  query: String!
  variables: String
  operation_name: String
  object_id: String
  execution_group: Int
  execution_phase: Int
  files: [BatchGraphqlFileInput!]
}

input BatchGraphqlFileInput {
  path: String!
  name: String!
  mime_type: String!
  data: String!
}

input BatchExecuteOptionsInput {
  wait_until: BatchWaitUntil
  execution_mode: BatchExecutionMode
  batch_plan: BatchGraphqlExecutionPlanInput
  direct_delivery_context: BatchDirectDeliveryContextInput
}

input BatchDirectDeliveryContextInput {
  submission_id: ID!
  delivery_id: ID!
  parent_delivery_id: ID
  delivery_kind: BatchDeliveryKind!
  delivery_protocol_version: Int!
  delivery_branch_kind: BatchDeliveryBranchKind!
  delivery_branch_sequence: Int!
  delivery_branch_ordinal: Int!
}

input BatchGraphqlExecutionPhaseInput {
  phase: Int!
  object_ids: [String!]!
}

input BatchGraphqlExecutionPlanInput {
  version: Int!
  execution_phases: [BatchGraphqlExecutionPhaseInput!]!
}

input BatchDeliveryChildReservationInput {
  branch_kind: BatchDeliveryBranchKind!
  branch_sequence: Int!
  branch_ordinal: Int!
  queue_payload: String!
}

type BatchAdmission {
  batch_id: ID!
  bundle_id: ID!
  work_id: ID!
  object_count: Int!
  object_types: [String!]!
  execution_preference: BatchExecutionPreference!
  execution_mode: BatchExecutionMode!
  execution_reason: BatchExecutionReason!
  eligible_execution_modes: [BatchExecutionMode!]!
  wait_until: BatchWaitUntil!
  status: BatchAdmissionStatus!
  idempotency_key: String!
}

type BatchMutationExecution {
  operation_count: Int!
  operation_errors: [BatchMutationOperationError!]!
  execution_mode: BatchExecutionMode!
  wait_until: BatchWaitUntil!
  side_effect_kinds: [String!]!
  materialized: Boolean!
}

type BatchMutationOperationError {
  operation_index: Int!
  object_id: String
  code: String
  message: String!
  retryable: Boolean!
}

type BatchDeliveryChild {
  delivery_id: ID!
  state: BatchDeliveryState!
  queue_payload: String!
}

type BatchDeliveryRootPromotion {
  delivery_id: ID!
}

type BatchDeliveryHandoff {
  parent_delivery_id: ID!
  handoff_evidence: BatchDeliveryHandoffEvidence!
  child_set_fingerprint: String
  child_count: Int!
  children: [BatchDeliveryChild!]!
  pending_children: [BatchDeliveryChild!]!
}

type BatchExecutionReceipt {
  receipt_id: ID!
  delivery_id: ID!
  submission_id: ID!
  delivery_payload_fingerprint: String!
  request_contract_version: Int!
  request_fingerprint: String!
  batch_plan_fingerprint: String!
  operation_manifest_fingerprint: String!
  operation_count: Int!
  execution_mode: BatchExecutionMode!
  wait_until: BatchWaitUntil!
  state: BatchExecutionReceiptState!
  result_fingerprint: String
  result_version: Int
  result_operation_count: Int
  result_operation_errors: [BatchMutationOperationError!]
  result_execution_mode: BatchExecutionMode
  result_wait_until: BatchWaitUntil
  result_side_effect_kinds: [String!]!
  result_materialized: Boolean
  completion_boundary: BatchExecutionReceiptCompletionBoundary
  side_effect_kind_counts: String
  prepared_at: DateTime!
  started_at: DateTime
  completed_at: DateTime
  materialized_at: DateTime
  failure_stage: String
  failure_code: String
  failure_message: String
  failure_fingerprint: String
  failure_retryable: Boolean
  failure_proof: BatchExecutionReceiptFailureProof
  failed_at: DateTime
  reconciliation_required_at: DateTime
  created_at: DateTime!
  updated_at: DateTime!
  last_error: String
}

type BatchExecutionReconciliation {
  reconciliation_id: ID!
  receipt_id: ID!
  delivery_id: ID!
  submission_id: ID!
  request_fingerprint: String!
  request_contract_version: Int!
  opened_from_receipt_state: BatchExecutionReceiptState!
  opened_reason: BatchExecutionReconciliationOpenedReason!
  state: BatchExecutionReconciliationState!
  evidence_class: BatchExecutionReconciliationEvidenceClass
  evidence_ref_type: BatchExecutionReconciliationEvidenceRefType
  evidence_ref_id: ID
  evidence_fingerprint: String
  attempt_observation_id: ID
  attempt_observed_at: DateTime
  attempt_expires_at: DateTime
  materialization_handoff_id: ID
  materialization_handoff_state: String
  resolved_receipt_state: BatchExecutionReceiptState
  opened_at: DateTime!
  last_observed_at: DateTime
  resolved_at: DateTime
  created_at: DateTime!
  updated_at: DateTime!
  last_error: String
}

type Query {
  batchDeliveryHandoff(parent_delivery_id: ID!): BatchDeliveryHandoff! @auth(for: [CONNECTORAPI])
  batchExecutionReceipt(delivery_id: ID!): BatchExecutionReceipt @auth(for: [CONNECTORAPI])
  batchExecutionReconciliation(delivery_id: ID!): BatchExecutionReconciliation @auth(for: [CONNECTORAPI])
}

type Mutation {
  stixBundleSubmit(connectorId: String!, bundle: String!, work_id: String, options: BatchSubmitOptionsInput): BatchAdmission! @auth(for: [CONNECTORAPI])
  enrichmentBatchResultSubmit(connectorId: String!, envelope: String!, result: String!): Boolean! @auth(for: [CONNECTORAPI])
  batchMutationsExecute(operations: [BatchGraphqlOperationInput!]!, options: BatchExecuteOptionsInput): BatchMutationExecution! @auth(for: [CONNECTORAPI])
  batchDeliveryPromoteRoot(candidate_id: ID!, payload_fingerprint: String!, work_id: String!, additional_work_ids: [String!]): BatchDeliveryRootPromotion! @auth(for: [CONNECTORAPI])
  batchDeliveryReserveChildren(parent_delivery_id: ID!, children: [BatchDeliveryChildReservationInput!]!): BatchDeliveryHandoff! @auth(for: [CONNECTORAPI])
  batchDeliveryReserveChildrenUpload(parent_delivery_id: ID!, children: Upload!): BatchDeliveryHandoff! @auth(for: [CONNECTORAPI])
  batchDeliveryMarkChildrenPublished(parent_delivery_id: ID!, child_delivery_ids: [ID!]!): BatchDeliveryHandoff! @auth(for: [CONNECTORAPI])
}
